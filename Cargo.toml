[package]
name = "vig"
version = "0.1.0"
edition = "2024"

[features]
default = ["asr"]
asr = ["dep:qwen3_asr", "dep:candle-core", "dep:sherpa-rs", "dep:reqwest", "dep:tokio", "dep:sha2", "dep:sha1", "dep:fs2", "dep:dirs", "dep:cc"]
ui-verify = ["gpui-kit/test-support"]

[dependencies]
qwen3_asr = { git = "https://github.com/lumosimmo/qwen3-asr-rs", rev = "7984967e8701cc90bb17d06453901036e36ca578", default-features = false, features = ["forced-aligner"], optional = true }
candle-core = { version = "0.9", optional = true }
sherpa-rs = { version = "=0.6.8", default-features = false, features = ["download-binaries", "sys"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }
sha2 = { version = "0.10", optional = true }
sha1 = { version = "0.10", optional = true }
fs2 = { version = "0.4", optional = true }
gpui-kit = "=0.7.1"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
smallvec = "1"
tempfile = "3"
dirs = { version = "6", optional = true }
rodio = { version = "0.21.1", default-features = false, features = ["playback", "symphonia-isomp4", "symphonia-aac"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(not(windows))'.dependencies]
zed-font-kit = "=0.14.1-zed"

[build-dependencies]
cc = { version = "1", optional = true }
