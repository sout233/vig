name: Build tagged versions

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  RUST_TOOLCHAIN: nightly-2026-05-05

jobs:
  build:
    name: Build ${{ matrix.platform.target }} (${{ matrix.flavor }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        flavor: [lite, full]
        platform:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    env:
      RUSTFLAGS: ${{ matrix.flavor == 'lite' && contains(matrix.platform.target, 'windows') && '-C target-feature=+crt-static' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev pkg-config \
            libasound2-dev libfontconfig1-dev libfreetype-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libxcomposite-dev libxdamage-dev libxfixes-dev libegl1-mesa-dev \
            libvulkan-dev libssl-dev libzstd-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev fonts-noto-cjk patchelf

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" '${{ matrix.platform.target }}'

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ env.RUST_TOOLCHAIN }}-${{ matrix.platform.target }}-${{ matrix.flavor }}
          cache-on-failure: true

      - name: Compile release
        env:
          MACOSX_DEPLOYMENT_TARGET: '15.0'
          BUILD_FLAVOR: ${{ matrix.flavor }}
        run: |
          args=()
          if [[ "$BUILD_FLAVOR" == lite ]]; then
            args+=(--no-default-features)
          fi
          cargo +"$RUST_TOOLCHAIN" build --locked --release --target '${{ matrix.platform.target }}' "${args[@]}"

      - name: Test edition packaging
        run: python -m unittest discover -s scripts -p test_release.py

      - name: Package executable and native libraries
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package-release.py '${{ matrix.platform.target }}' '${{ matrix.flavor }}'

      - name: Upload build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vig-${{ matrix.flavor }}-${{ matrix.platform.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish-release.yml
    with:
      tag: ${{ github.ref_name }}
      run_id: ${{ github.run_id }}
